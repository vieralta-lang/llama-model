quarkus.http.port=8081
uarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=llama3
quarkus.langchain4j.ollama.chat-model.max-tokens=128
quarkus.langchain4j.ollama.chat-model.temperature=0.2
quarkus.langchain4j.ollama.timeout=120s
quarkus.langchain4j.ollama.streaming.enabled=true

# REST Client (ESSENCIAL)
quarkus.rest-client.connect-timeout=30000
quarkus.rest-client.read-timeout=120000

quarkus.log.category."io.quarkiverse.langchain4j".level=DEBUG